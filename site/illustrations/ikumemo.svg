<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
<title id="t">ikumemo のイメージ図（実際の画面ではありません）</title>
<desc id="d">スマホ画面にマイクで話して追加する入力と買い物リスト、スワイプで買ったことを記録する行、期限のお知らせ、小さなカレンダーを描いた模式図。</desc>
<style>
