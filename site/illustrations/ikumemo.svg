.bg{fill:var(--bg)}.dev{fill:var(--dev)}.scr{fill:var(--scr)}.pan{fill:var(--pan);stroke:var(--ln);stroke-width:1.5}
.tx{fill:var(--tx);font:600 12px system-ui,sans-serif}.sm{fill:var(--mu);font:11px system-ui,sans-serif}
.ac{fill:var(--ac)}.ok{fill:var(--ok)}.oks{fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wn{fill:var(--wn)}.bar{fill:var(--ln)}
.f{fill:var(--acf)}.fs{fill:none;stroke:var(--acf);stroke-width:3;stroke-linecap:round}.ft{fill:var(--acf);font:600 12px system-ui,sans-serif}
</style>
