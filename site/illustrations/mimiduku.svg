.bg{fill:var(--bg)}.dev{fill:var(--dev)}.scr{fill:var(--scr)}.pan{fill:var(--pan);stroke:var(--ln);stroke-width:1.5}
.sm{fill:var(--mu);font:11px system-ui,sans-serif}
.ac{fill:var(--ac)}.wn{fill:var(--wn)}.bar{fill:var(--ln)}.f{fill:var(--acf)}
</style>
