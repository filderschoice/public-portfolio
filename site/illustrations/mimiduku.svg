<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
<title id="t">mimiduku のイメージ図（実際の画面ではありません）</title>
<desc id="d">スマホの画面に怪しい広告が出て、画面の右端に止まったみみづくのバッジが警告で知らせている模式図。</desc>
<style>
